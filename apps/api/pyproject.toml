[project]
name = "tribe-creator-api"
version = "0.1.0"
description = "FastAPI backend for the TRIBE v2 creator analyzer MVP."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.12,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "numpy>=2.2.6,<3.0.0",
  "opencv-python-headless>=4.12.0.88,<5.0.0",
  "pandas>=2.2.3,<3.0.0",
  "pydantic-settings>=2.9.1,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "tribev2 @ git+https://github.com/facebookresearch/tribev2.git@72399081ed3f1040c4d996cefb2864a4c46f5b8e",
  "uvicorn>=0.34.2,<1.0.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.5,<9.0.0",
  "pytest-asyncio>=0.26.0,<1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
